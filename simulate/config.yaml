robot: "h1_2"  # Robot name, "go2", "b2", "b2w", "h1", "go2w", "g1"
robot_scene: "scene_comx06_fwd5left5.xml" # NEW-SOLE-ERA DEFAULT (2026-07-30): comx06 body + rigid floor = the p12f/p12g training-era setup, matches Isaac rigid plane. Desk-line work: run_mujoco_desk_line.sh swaps to its own scenes (--stock = dp2b cush75).

domain_id: 0  # Domain id
interface: "lo" # Interface

# Architecture B is joystickless BY DESIGN (everything runs from the PC; the
# deployed product has no gamepad). Keep 0 — with 1 and no gamepad the sim
# exits at startup ("Joystick open failed."), see the 2026-07-03 incident.
use_joystick: 0 # Simulate Unitree WirelessController using a gamepad
joystick_type: "xbox" # support "xbox" and "switch" gamepad layout
joystick_device: "/dev/input/js0" # Device path
joystick_bits: 16 # Some game controllers may only have 8-bit accuracy

print_scene_information: 1 # Print link, joint and sensors information of robot

# Virtual elastic band (suspension harness). Enable to hold the robot up during
# bring-up; tune stiffness so the spring equilibrium sits near the crouch with
# the robot with feet on the floor during bring-up, then the controller
# takes over. If the robot hangs in the air, lower band_stiffness a little;
# if it sags, raise it. Keys 7/8 (or up/down) in the sim window nudge the height live.
enable_elastic_band: 1 # Virtual spring band, used for lifting h1
band_anchor: [0.0, 0.0, 3.0]   # world point the band pulls the pelvis toward
band_rest_length: 0.0          # spring rest length (m)
imu_noise_std_deg: 0       # OU IMU noise: stationary std (deg) of the published orientation error; 0 = off
imu_noise_tau_ms: 40       # OU correlation time (ms) — fit both from real FixStand IMU logs
band_stiffness: 345.0          # N/m  (holds the robot a little higher in FixStand — less slouch)
band_damping: 150.0            # N·s/m
